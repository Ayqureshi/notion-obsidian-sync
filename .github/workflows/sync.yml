name: Notion to Obsidian Auto-Sync

on:
  repository_dispatch:
    types: [calendar_sync, sync_vault] # Listens for API POST requests from macOS Shortcuts
  workflow_dispatch:                   # Keeps the manual "Run workflow" button in GitHub UI

permissions:
  contents: write                     # Grants permission to commit and push changes back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv spacy
          python -m spacy download en_core_web_sm

      - name: Run Automation Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_LAB_DB_ID: ${{ secrets.NOTION_LAB_DB_ID }}
          NOTION_RESEARCH_DB_ID: ${{ secrets.NOTION_RESEARCH_DB_ID }}
          OBSIDIAN_BASE_DIR: "."
        run: python automation.py

      - name: Commit and Push New Notes to Repo
        run: |
          git config --global user.name "NotionSyncBot"
          git config --global user.email "bot@github.com"
          git add .
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-synced new notes from Notion" && git push)
