name: Router & Calendar Sync Pipeline

on:
  repository_dispatch:
    types: [calendar_sync, sync_vault] # Listens for API POST requests from macOS Shortcuts
  workflow_dispatch:                   # Allows manual trigger from GitHub UI

permissions:
  contents: write                     # Grants permission to push git commits back to the repo

jobs:
  sync-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install spacy click icalendar requests python-dotenv "numpy<2.0"
          python -m spacy download en_core_web_sm

      - name: Execute Calendar Router Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LAB_DB_ID: ${{ secrets.NOTION_LAB_DB_ID }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_RESEARCH_DB_ID: ${{ secrets.NOTION_RESEARCH_DB_ID }}
          ICS_URL: ${{ secrets.ICS_URL }}
        run: python calendar_router.py

      - name: Commit and Push Changes to Repo
        run: |
          git config --global user.name "NotionSyncBot"
          git config --global user.email "bot@github.com"
          git add .
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-synced calendar router changes" && git push)
