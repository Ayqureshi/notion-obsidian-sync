name: Router & Calendar Sync Pipeline

on:
  schedule:
    # Runs automatically every 3 hours
    - cron: '15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install spacy click icalendar requests python-dotenv "numpy<2.0"

      - name: Execute Calendar Router Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LAB_DB_ID: ${{ secrets.NOTION_LAB_DB_ID }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_RESEARCH_DB_ID: ${{ secrets.NOTION_RESEARCH_DB_ID }}
          ICS_URL: ${{ secrets.ICS_URL }}
        run: python calendar_router.py
